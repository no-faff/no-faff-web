<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Support No Faff</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', sans-serif;
    background: #fef3c7;
    background-image:
      radial-gradient(circle at 20% 80%, #fde68a 0%, transparent 50%),
      radial-gradient(circle at 80% 20%, #fed7aa 0%, transparent 50%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }

  .page {
    max-width: 460px;
    width: 100%;
  }

  .hero {
    text-align: center;
    margin-bottom: 1.5rem;
  }

  .chick-img {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    border: 4px solid #1e293b;
    box-shadow: 6px 6px 0 #1e293b;
    object-fit: cover;
    margin-bottom: 1rem;
    animation: bobble 3s ease-in-out infinite;
  }

  @keyframes bobble {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    25% { transform: translateY(-6px) rotate(2deg); }
    75% { transform: translateY(-3px) rotate(-1deg); }
  }

  .speech-bubble {
    position: relative;
    background: white;
    border: 3px solid #1e293b;
    border-radius: 20px;
    padding: 1.25rem 1.5rem;
    box-shadow: 5px 5px 0 #1e293b;
    margin-bottom: 0.75rem;
  }

  .speech-bubble::after {
    content: '';
    position: absolute;
    top: -18px;
    left: 50%;
    margin-left: -12px;
    border: 10px solid transparent;
    border-bottom: 10px solid white;
    filter: drop-shadow(0 -3px 0 #1e293b);
  }

  h1 {
    color: #1e293b;
    font-size: 1.6rem;
    font-weight: 800;
    line-height: 1.3;
  }

  .subtitle {
    color: #64748b;
    font-size: 1rem;
    font-weight: 500;
    margin-top: 0.25rem;
  }

  .option {
    display: flex;
    align-items: center;
    gap: 1rem;
    padding: 1rem 1.25rem;
    background: white;
    border: 3px solid #1e293b;
    border-radius: 16px;
    margin-bottom: 0.75rem;
    text-decoration: none;
    color: #1e293b;
    box-shadow: 4px 4px 0 #1e293b;
    transition: transform 0.15s, box-shadow 0.15s;
    cursor: pointer;
  }

  .option:hover {
    transform: translate(-2px, -2px);
    box-shadow: 6px 6px 0 #1e293b;
  }

  .option:active {
    transform: translate(2px, 2px);
    box-shadow: 2px 2px 0 #1e293b;
  }

  .option-icon {
    width: 48px;
    height: 48px;
    border-radius: 12px;
    border: 2.5px solid #1e293b;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.5rem;
    flex-shrink: 0;
  }

  .kofi .option-icon {
    background: #ff5e5b;
    color: white;
  }

  .bitcoin .option-icon {
    background: #f7931a;
    color: white;
  }

  .option-text strong {
    display: block;
    font-size: 1.05rem;
    font-weight: 700;
  }

  .option-text span {
    font-size: 0.85rem;
    color: #64748b;
    font-weight: 500;
  }

  .btc-group {
    background: white;
    border: 3px solid #1e293b;
    border-radius: 16px;
    box-shadow: 4px 4px 0 #1e293b;
    margin-bottom: 0.75rem;
    overflow: hidden;
  }

  .btc-group .btc-header {
    display: flex;
    align-items: center;
    gap: 1rem;
    padding: 1rem 1.25rem;
  }

  .btc-group .btc-header .option-icon {
    background: #f7931a;
    color: white;
  }

  .btc-address {
    padding: 0.75rem 1.25rem;
    background: #fef9ee;
    border-top: 2px dashed #e2e8f0;
    font-family: 'Courier New', monospace;
    font-size: 0.72rem;
    font-weight: 700;
    color: #64748b;
    word-break: break-all;
    cursor: pointer;
    transition: background 0.15s;
    text-align: center;
  }

  .btc-address:hover { background: #fef3c7; }

  .btc-address .copy-hint {
    display: block;
    font-family: 'Inter', sans-serif;
    font-size: 0.8rem;
    font-weight: 600;
    color: #f7931a;
    margin-top: 0.2rem;
  }

  .footer {
    text-align: center;
    margin-top: 1.5rem;
    font-size: 0.85rem;
    font-weight: 600;
    color: #94a3b8;
  }

  .footer a {
    color: #6366f1;
    text-decoration: none;
    border-bottom: 2px solid #6366f166;
  }

  .footer a:hover {
    border-bottom-color: #6366f1;
  }

  .wiggle:hover {
    animation: wiggle 0.4s ease-in-out;
  }

  @keyframes wiggle {
    0%, 100% { transform: rotate(0deg); }
    25% { transform: rotate(-3deg); }
    50% { transform: rotate(3deg); }
    75% { transform: rotate(-2deg); }
  }
</style>
</head>
<body>

<div class="page">
  <div class="hero">
    <img src="chick.png" alt="No Faff chick" class="chick-img wiggle">
  </div>

  <div class="speech-bubble">
    <h1>Thanks for using No Faff!</h1>
    <p class="subtitle">Everything's free and open source. If you fancy saying thanks, here's how.</p>
  </div>

  <a href="https://ko-fi.com/nofaff" class="option kofi" target="_blank" rel="noopener">
    <div class="option-icon">&#9749;</div>
    <div class="option-text">
      <strong>Buy me a cuppa</strong>
      <span>Via Ko-fi</span>
    </div>
  </a>

  <div class="btc-group">
    <div class="btc-header">
      <div class="option-icon" style="background: #f7931a; color: white; width: 48px; height: 48px; border-radius: 12px; border: 2.5px solid #1e293b; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; flex-shrink: 0;">&#8383;</div>
      <div class="option-text">
        <strong>Bitcoin</strong>
        <span>Send directly to wallet</span>
      </div>
    </div>
    <div class="btc-address" onclick="navigator.clipboard.writeText('bc1qcr52sqcdh0vt0zgjcmt2htvgkflc8yg2de5nj5'); this.querySelector('.copy-hint').textContent = 'Copied!'">
      bc1qcr52sqcdh0vt0zgjcmt2htvgkflc8yg2de5nj5
      <span class="copy-hint">Click to copy</span>
    </div>
  </div>

  <div class="footer">
    <a href="https://github.com/no-faff">github.com/no-faff</a>
  </div>
</div>

</body>
</html>
